---
rules:
  unpinned-uses:
    config:
      policies:
        # Actions are pinned to commits by .github/workflows/actions.lock, which the
        # "Verify actions lockfile" workflow checks, so tag refs are fine in workflows.
        # super-linter bundles zizmor 1.30.1, which predates lockfile support (1.32.0);
        # this can be removed once it ships a newer version.
        "*": ref-pin
