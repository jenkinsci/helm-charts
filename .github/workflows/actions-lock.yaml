name: Verify actions lockfile

# Fails if .github/workflows/actions.lock is out of sync with the workflows,
# or if a locked commit no longer verifies upstream.
# Docs: https://docs.github.com/en/actions/how-tos/secure-your-work/lock-workflow-dependencies
on:
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify lockfile
        run: |
          # renovate: datasource=github-releases depName=github/gh-actions-lock
          GH_ACTIONS_LOCK_VERSION=v0.5.1
          gh extension install github/gh-actions-lock --pin "${GH_ACTIONS_LOCK_VERSION}"
          gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
